<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STOIC</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem; text-align: center; }
      main > * + * { margin-top: 1rem; }
      .pebble { width: 150px; margin: 0 auto; }
      h1 { font-size: 2.2rem; }
      #body { font-size: 1.15rem; }
      .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 2rem; }
      .actions button { width: 100%; }
      footer { margin-top: 2rem; }
    </style>
  </head>
  <body>
    <main>
      <img class="pebble float" src="pebble.svg" alt="" />
      <h1 id="title">Pause for a moment</h1>
      <p id="body"></p>
      <div class="actions">
        <button id="back" type="button">Go back</button>
        <button id="other" type="button" class="outline" hidden></button>
      </div>
      <p class="small muted" id="footer">You set this up in STOIC. You can change it there any time.</p>
      <p class="small"><a href="options.html" id="settings">Open STOIC settings</a></p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STOIC</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body { padding: 1.5rem 1rem 4rem; }
      .wrap { max-width: 46rem; margin: 0 auto; }
      .wrap > * + *, #app > * + * { margin-top: 1.5rem; }
      header { display: flex; align-items: center; gap: 1rem; }
      header img { width: 72px; }
      fieldset { border: 0; padding: 0; margin: 0; }
      legend { font-weight: 800; margin-bottom: 0.25rem; }
      .rule + .rule, .schedule + .schedule { margin-top: 0.75rem; }
      .big { font-family: "Fredoka", system-ui, sans-serif; font-size: 2.4rem; line-height: 1; }
      #toast { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); max-width: 90vw; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="pebble.svg" alt="" class="float" />
        <div>
          <h1>STOIC</h1>
          <p class="muted">Pauses, limits, schedules and focus for the apps on this computer. Everything stays on this computer.</p>
        </div>
      </header>
      <main id="app"></main>
    </div>
    <p id="toast" class="card tint-butter" role="status" hidden></p>
    <script type="module" src="settings.js"></script>
  </body>
</html>
